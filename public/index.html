<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvidAffiliate - Affiliate Link Health Report Card</title>
    <meta name="description" content="Unlock your website's hidden affiliate revenue with our comprehensive link audit and monetization Report">
  </head>
  <body>
    <!-- Netlify Forms - Hidden forms for detection -->
    <form name="audit-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="audit-request" />
      <input type="text" name="website-url" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="traffic-tier">
        <option value="<10k">Less than 10,000 visitors</option>
        <option value="10k-50k">10,000 - 50,000 visitors</option>
        <option value="50k-250k">50,000 - 250,000 visitors</option>
        <option value="250k+">More than 250,000 visitors</option>
      </select>
      <select name="earnings-tier">
        <option value="<100">Less than $100</option>
        <option value="100-1000">$100 - $1,000</option>
        <option value="1000-5000">$1,000 - $5,000</option>
        <option value="5000-10000">$5,000 - $10,000</option>
        <option value="10000-25000">$10,000 - $25,000</option>
        <option value="25000+">More than $25,000</option>
        <option value="prefer not to say">Prefer not to say</option>
      </select>
      <input type="checkbox" name="accepted-terms" />
      <input type="text" name="bot-field" style="display: none;" />
    </form>

    <form name="contact-form" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-form" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" style="display: none;" />
    </form>

    <form name="services-inquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="services-inquiry" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="url" name="website" />
      <select name="traffic-tier">
        <option value="<10k">Less than 10,000 visitors</option>
        <option value="10k-50k">10,000 - 50,000 visitors</option>
        <option value="50k-250k">50,000 - 250,000 visitors</option>
        <option value="250k+">More than 250,000 visitors</option>
      </select>
      <select name="revenue-tier">
        <option value="<100">Less than $100</option>
        <option value="100-1000">$100 - $1,000</option>
        <option value="1000-5000">$1,000 - $5,000</option>
        <option value="5000-10000">$5,000 - $10,000</option>
        <option value="10000+">More than $10,000</option>
        <option value="prefer not to say">Prefer not to say</option>
      </select>
      <textarea name="goals"></textarea>
      <textarea name="additional-info"></textarea>
      <input type="text" name="bot-field" style="display: none;" />
    </form>

    <form name="optional-details" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="optional-details" />
      <input type="url" name="website-url" />
      <input type="email" name="email" />
      <select name="traffic-tier">
        <option value="0-10k">0 - 10,000 visitors</option>
        <option value="10k-50k">10,000 - 50,000 visitors</option>
        <option value="50k-100k">50,000 - 100,000 visitors</option>
        <option value="100k-500k">100,000 - 500,000 visitors</option>
        <option value="500k+">500,000+ visitors</option>
      </select>
      <input type="text" name="primary-niche" />
      <input type="text" name="affiliate-networks" />
      <textarea name="biggest-challenge"></textarea>
      <input type="text" name="bot-field" style="display: none;" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
