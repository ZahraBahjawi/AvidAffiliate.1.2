# This file tells Netlify how to build your Vite project.
# It ensures that your environment variables are correctly handled.

[build]
  # This is the command that will be run to build your site.
  command = "npm run build"
  
  # This is the directory that contains your built site.
  publish = "dist"

  [build.environment]
    # This explicitly tells the build to use Node.js version 18.
    NODE_VERSION = "18"
    
    # This variable disables Netlify's secret scanner for the build.
    # This is necessary because the scanner is incorrectly flagging public Vite environment variables.
    SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

