# This file tells Netlify how to build your Vite project.
# It ensures that your environment variables are correctly handled.

[build]
  # This is the command that will be run to build your site.
  command = "npm run build"
  
  # This is the directory that contains your built site.
  publish = "dist"

  [build.environment]
    # This explicitly tells the build to use Node.js version 18.
    NODE_VERSION = "18"

  # This section tells Netlify's security scanner what to do.
  [build.processing.secrets]
    # This tells the scanner to ignore these specific keys if found in build output.
    omit_keys = ["VITE_SUPABASE_ANON_KEY", "VITE_SUPABASE_URL"]
    
    # This tells the scanner to not even look inside the DEPLOYMENT.md file.
    omit_paths = ["DEPLOYMENT.md"]

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

